name: UniqueKits
version: 1.1.2
main: jp.example.uniquekits.UniqueKitsPlugin
api-version: '1.21'
author: example
commands:
  kit: {usage: '/kit [public|private] [name]'}
  kitcreator: {usage: /kitcreator}
  setkitcreator: {usage: /setkitcreator, permission: uniquekits.admin}
  createukit: {usage: '/createukit [public] <name>'}
  deleteukit: {usage: '/deleteukit [public] <name>'}
permissions:
  uniquekits.admin: {default: op}
